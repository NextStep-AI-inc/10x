name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      # Pinned to a SHA, not a moving tag: this job imports the Developer ID key into a
      # keychain and writes the Sparkle signing key to disk.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The job's only auth need is GH_TOKEN, supplied to the release step directly.
          persist-credentials: false
          # Sparkle compares CFBundleVersion, which release.sh derives from the
          # commit count. A shallow checkout makes every release claim build 1.
          fetch-depth: 0

      - name: Select the Xcode toolchain
        env:
          # Escape hatch for pinning an exact build while diagnosing toolchain skew.
          # Set as a repository variable; empty means take the newest 26.x.
          XCODE_PREFERRED: ${{ vars.XCODE_PREFERRED }}
        run: |
          set -euo pipefail
          # The project is developed and tested against Xcode 26.x (Swift 6.3). The
          # runner's default is older, and Swift 6.0 rejects `sending` closures in
          # OmpKit that 6.3 accepts, so the archive fails on a toolchain mismatch
          # rather than on anything wrong with the code. Pin it explicitly.
          echo "Xcode versions available on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # XCODE_PREFERRED lets us pin an exact build while diagnosing toolchain
          # skew; otherwise take the newest 26.x on the image.
          NEWEST=""
          if [ -n "${XCODE_PREFERRED:-}" ] && [ -d "/Applications/${XCODE_PREFERRED}.app" ]; then
            NEWEST="/Applications/${XCODE_PREFERRED}.app"
          else
            # Compare with sort -V, not glob order. Globbing is lexicographic, so the
            # previous "keep the last match" loop would pick 26.3 over 26.10.
            BEST_VERSION=""
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              v=$(/usr/bin/defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
              major=${v%%.*}
              [ "$major" -ge 26 ] 2>/dev/null || continue
              if [ -z "$BEST_VERSION" ] || \
                 [ "$(printf '%s\n%s\n' "$BEST_VERSION" "$v" | sort -V | tail -1)" = "$v" ]; then
                BEST_VERSION="$v"; NEWEST="$app"
              fi
            done
          fi
          if [ -z "$NEWEST" ]; then
            echo "::error::No Xcode 26 or newer on this runner image."
            exit 1
          fi
          # The app icon ships as a prebuilt App/Resources/AppIcon.icns rather than an
          # Icon Composer .icon, because actool on every runner Xcode crashes compiling
          # a .icon authored in 26.6. The .icon stays in the repo as the authoring
          # source but is not a build resource. See scripts/generate_xcodeproj.rb.
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Import the Developer ID certificate
        env:
          APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_CSC_LINK" ] || { echo "::error::APPLE_CSC_LINK is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -P "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the Sparkle signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          chmod 600 "$RUNNER_TEMP/sparkle_key"

      - name: Build, notarize, and publish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle_key
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Remove the signing key and keychain
        if: always()
        run: |
          rm -Pf "$RUNNER_TEMP/sparkle_key"
          security list-keychain -d user -s login.keychain || true
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
