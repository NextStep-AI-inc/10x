name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Sparkle compares CFBundleVersion, which release.sh derives from the
          # commit count. A shallow checkout makes every release claim build 1.
          fetch-depth: 0

      - name: Select the Xcode toolchain
        run: |
          set -euo pipefail
          # The project is developed and tested against Xcode 26.x (Swift 6.3). The
          # runner's default is older, and Swift 6.0 rejects `sending` closures in
          # OmpKit that 6.3 accepts, so the archive fails on a toolchain mismatch
          # rather than on anything wrong with the code. Pin it explicitly.
          echo "Xcode versions available on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(/usr/bin/defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            major=${v%%.*}
            if [ "$major" -ge 26 ] 2>/dev/null; then NEWEST="$app"; fi
          done
          if [ -z "$NEWEST" ]; then
            echo "::error::No Xcode 26 or newer on this runner image. The project needs"
            echo "::error::Swift 6.3; the newest available is listed above. Switch runs-on"
            echo "::error::to a macos-26 image, or pin the toolchain another way."
            exit 1
          fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Import the Developer ID certificate
        env:
          APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_CSC_LINK" ] || { echo "::error::APPLE_CSC_LINK is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -P "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the Sparkle signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          chmod 600 "$RUNNER_TEMP/sparkle_key"

      - name: Build, notarize, and publish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle_key
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Remove the signing key
        if: always()
        run: rm -Pf "$RUNNER_TEMP/sparkle_key"
